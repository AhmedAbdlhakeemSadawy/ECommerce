<div class="container mt-4">
  <h2>Create New Order</h2>
  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="mt-4">
    <div class="mb-3">
      <label for="product" class="form-label">Select Product</label>
      <select 
        id="product" 
        formControlName="productId" 
        class="form-select"
        (change)="onProductChange()">
        <option value="">Choose a product...</option>
        <option *ngFor="let product of products" [value]="product.id">
          {{product.name}} - ${{product.price}}
        </option>
      </select>
      <div *ngIf="orderForm.get('productId')?.invalid && orderForm.get('productId')?.touched" class="text-danger">
        Please select a product
      </div>
    </div>

    <div class="mb-3">
      <label for="quantity" class="form-label">Quantity</label>
      <input 
        type="number" 
        id="quantity" 
        formControlName="quantity" 
        class="form-control"
        min="1"
        (change)="updateTotalAmount()">
      <div *ngIf="orderForm.get('quantity')?.invalid && orderForm.get('quantity')?.touched" class="text-danger">
        <div *ngIf="orderForm.get('quantity')?.errors?.['required']">Quantity is required</div>
        <div *ngIf="orderForm.get('quantity')?.errors?.['min']">Quantity must be at least 1</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Total Amount</label>
      <p class="form-control-static">${{totalAmount | number:'1.2-2'}}</p>
    </div>

    <div class="d-flex gap-2">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="!orderForm.valid">
        Place Order
      </button>
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="router.navigate(['/orders'])">
        Cancel
      </button>
    </div>
  </form>
</div>
